[project]
name = "missingmcp"
version = "0.1.0"
description = "MissingMCP — multi-user OAuth 2.1 gateway serving the connectors Claude is missing (Garmin via the unmodified garmin_mcp worker)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vaclav Slajs", email = "vaclav@slajs.eu" }]
keywords = ["mcp", "missingmcp", "garmin", "oauth", "claude", "garmin-connect"]
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "garminconnect>=0.3.2",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    # PostHog telemetry (telemetry.py). The SDK is thread-based (no asyncio) and
    # pulls a second HTTP stack (requests) — accepted in the 2026-07-20 design
    # spec. 0-cost when POSTHOG_API_KEY is unset: telemetry.init() is a no-op.
    "posthog>=7.27,<8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # Force-pin below the garmin_mcp worker's ceiling (Taxuspt/garmin_mcp pins
    # mcp<2 itself — 2.x renamed mcp.server.fastmcp to mcp.server.mcpserver,
    # breaking its import: "ModuleNotFoundError: No module named
    # 'mcp.server.fastmcp'"). Without this explicit pin here, whatever pulls a
    # newer mcp transitively (the telemetry deps above, as of the
    # feature/posthog-adapter merge on 2026-08-22) wins dependency resolution
    # and the garmin-mcp worker install step no longer gets the version it
    # needs. Confirmed root cause of the 2026-08-22 22:24 CST outage — see
    # Railway deploy 077c5118 build log and worker-start-failed traceback.
    "mcp>=1.28.1,<2",
]

[project.urls]
Homepage = "https://github.com/VelkyVenik/missingmcp"
Repository = "https://github.com/VelkyVenik/missingmcp"
Issues = "https://github.com/VelkyVenik/missingmcp/issues"

[project.scripts]
missingmcp = "missingmcp.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missingmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Upstream deprecation from newer Starlette: its TestClient warns about httpx vs
    # httpx2. We use httpx (>=0.27) directly in proxy.py at runtime and only touch
    # TestClient in tests, so this is not actionable here — keep test output pristine.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
