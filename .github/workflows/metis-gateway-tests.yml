name: Metis Gateway validation
on:
  push:
    branches: [metis/orchestration-gateway-v1, metis/productive-writes-v2]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'metis-gateway-bridge/**'
      - 'metis-orchestrator-prototype/**'
      - '.github/workflows/metis-gateway-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: node metis-gateway-bridge/test_bridge.cjs
      - run: node metis-orchestrator-prototype/tools/test_productive.cjs
      - run: node metis-orchestrator-prototype/tools/test_terminal.cjs
      - run: node tools/run_local.js all
        working-directory: metis-orchestrator-prototype
      - run: node tools/static_guards.js
        working-directory: metis-orchestrator-prototype
